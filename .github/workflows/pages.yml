name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build public website
        run: python scripts/build_pages.py --output "$RUNNER_TEMP/site"
      - name: Audit staged pages and charts
        run: node tests/audit_pages.cjs "$RUNNER_TEMP/site"
      - name: Test Pages packaging and failure paths
        run: python -m unittest discover -s tests -p test_pages.py -v
      - name: Upload Pages artifact
        id: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/site
      - name: Check upload completed
        if: github.event_name != 'pull_request'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.artifact_id != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy uploaded website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
